<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Amirkhan Sagyndyk — Astana skyline at night">
  <title>Amirkhan Sagyndyk</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="0.65" stop-color="#11131c"/>
      <stop offset="1" stop-color="#1c1712"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset="0.45" stop-color="#ffbe4d"/>
      <stop offset="1" stop-color="#b8660f"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="14"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .star { fill: #e9e4d8; animation: tw 4s ease-in-out infinite; }
      .s2 { animation-delay: -1.3s; animation-duration: 5.5s; }
      .s3 { animation-delay: -2.6s; animation-duration: 3.2s; }
      @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 905px 118px; }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.18) } }
      .win { fill: #ffcf7a; animation: flick 7s steps(1) infinite; }
      .w2 { animation-delay: -2s; } .w3 { animation-delay: -4.5s; } .w4 { animation-delay: -5.7s; }
      @keyframes flick { 0%,62% { opacity: .85 } 63%,78% { opacity: .12 } 79%,100% { opacity: .85 } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
      .meteor { animation: fly 11s linear infinite; opacity: 0; }
      @keyframes fly {
        0%,86% { opacity: 0; transform: translate(0,0) }
        87% { opacity: 1 }
        95% { opacity: 0; transform: translate(-260px,110px) }
        100% { opacity: 0; transform: translate(-260px,110px) }
      }
      .type { animation: reveal 2.4s steps(34) .4s both; }
      @keyframes reveal { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- stars -->
    <g>
      <circle class="star" cx="540" cy="40" r="1.2"/>
      <circle class="star s2" cx="612" cy="92" r="1"/>
      <circle class="star s3" cx="700" cy="30" r="1.4"/>
      <circle class="star" cx="760" cy="74" r="0.9"/>
      <circle class="star s2" cx="830" cy="22" r="1.1"/>
      <circle class="star s3" cx="980" cy="46" r="1.3"/>
      <circle class="star" cx="1040" cy="98" r="0.9"/>
      <circle class="star s2" cx="1110" cy="34" r="1.2"/>
      <circle class="star s3" cx="1160" cy="120" r="1"/>
      <circle class="star" cx="660" cy="150" r="0.8"/>
      <circle class="star s3" cx="1080" cy="168" r="0.8"/>
      <circle class="star s2" cx="470" cy="128" r="0.9"/>
      <circle class="star" cx="420" cy="24" r="1"/>
      <circle class="star s2" cx="360" cy="70" r="0.8"/>
    </g>
    <g class="meteor"><line x1="1120" y1="40" x2="1160" y2="24" stroke="#fff3d6" stroke-width="1.4" stroke-linecap="round"/></g>

    <!-- horizon haze -->
    <rect y="250" width="1200" height="90" fill="url(#haze)"/>

    <!-- far skyline -->
    <g fill="#171922">
      <rect x="560" y="268" width="26" height="72"/>
      <rect x="590" y="250" width="18" height="90"/>
      <rect x="612" y="276" width="34" height="64"/>
      <rect x="652" y="238" width="22" height="102"/>
      <rect x="678" y="262" width="30" height="78"/>
      <rect x="712" y="282" width="40" height="58"/>
      <rect x="1140" y="270" width="24" height="70"/>
      <rect x="1168" y="252" width="20" height="88"/>
    </g>

    <!-- near blocks -->
    <g fill="#0d0e14">
      <rect x="760" y="228" width="44" height="112"/>
      <path d="M812 340 V214 l14 -10 l14 10 V340 Z"/>
      <rect x="850" y="258" width="24" height="82"/>
      <rect x="940" y="246" width="34" height="94"/>
      <rect x="980" y="270" width="26" height="70"/>
    </g>
    <g>
      <rect class="win" x="768" y="240" width="4" height="5"/>
      <rect class="win w2" x="784" y="262" width="4" height="5"/>
      <rect class="win w3" x="776" y="290" width="4" height="5"/>
      <rect class="win w4" x="822" y="232" width="4" height="5"/>
      <rect class="win" x="830" y="276" width="4" height="5"/>
      <rect class="win w2" x="948" y="262" width="4" height="5"/>
      <rect class="win w3" x="960" y="300" width="4" height="5"/>
      <rect class="win w4" x="988" y="284" width="4" height="5"/>
    </g>

    <!-- Baiterek -->
    <circle class="pulse" cx="905" cy="118" r="70" fill="url(#glow)"/>
    <g fill="#e8e2d4">
      <path d="M899 340 L901 172 L909 172 L911 340 Z"/>
      <path d="M901 176 C 884 160, 878 142, 880 118 L 884 118 C 884 140, 892 156, 902 168 Z"/>
      <path d="M909 176 C 926 160, 932 142, 930 118 L 926 118 C 926 140, 918 156, 908 168 Z"/>
      <path d="M903 172 C 894 158, 890 142, 891 122 L 894 122 C 894 140, 898 154, 905 166 Z" opacity=".7"/>
      <path d="M907 172 C 916 158, 920 142, 919 122 L 916 122 C 916 140, 912 154, 905 166 Z" opacity=".7"/>
    </g>
    <circle cx="905" cy="118" r="21" fill="url(#orb)"/>

    <!-- Khan Shatyr -->
    <path d="M1012 340 L1086 206 L1092 214 L1140 340 Z" fill="#14151d"/>
    <path d="M1086 206 L1092 214 L1100 340 L1092 340 Z" fill="#1d1f2a"/>
    <line x1="1086" y1="206" x2="1094" y2="190" stroke="#2a2c38" stroke-width="2"/>

    <!-- ground -->
    <rect y="340" width="1200" height="40" fill="#08090d"/>
    <line x1="0" y1="340.5" x2="1200" y2="340.5" stroke="#ffb547" stroke-opacity=".35"/>

    <!-- text -->
    <g class="mono">
      <text x="56" y="92" font-size="13" fill="#8a8578" letter-spacing="2">~/astana · 51.13°N 71.43°E</text>
      <text x="56" y="150" font-size="44" font-weight="700" fill="#f1ece0" letter-spacing="1">Amirkhan</text>
      <text x="56" y="198" font-size="44" font-weight="700" fill="#f1ece0" letter-spacing="1">Sagyndyk<tspan fill="#ffb547">.</tspan></text>
      <g class="type">
        <text x="56" y="246" font-size="16" fill="#c9c2b2"><tspan fill="#ffb547">$</tspan> ship --whole-product --not-screens</text>
      </g>
      <rect class="cursor" x="414" y="233" width="9" height="17" fill="#ffb547"/>
      <text x="56" y="300" font-size="12" fill="#6f6a5f" letter-spacing="1.5">FULL-STACK · NEXT.JS · TYPESCRIPT · POSTGRES · GO</text>
    </g>
  </g>
</svg>
